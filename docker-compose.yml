services:
  db:
    image: postgres:16-alpine
    container_name: shipsense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ship-sense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shipsense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [shipsense]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipsense-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:root@shipsense-db:5432/ship-sense}
      DB_HOST: ${DB_HOST:-shipsense-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-ship-sense}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      SWIFTSHIP_WEBHOOK_SECRET: ${SWIFTSHIP_WEBHOOK_SECRET:-swiftship-demo-secret}
      BLUEROUTE_WEBHOOK_SECRET: ${BLUEROUTE_WEBHOOK_SECRET:-blueroute-demo-secret}
      WEBHOOK_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:-5000}
      WEBHOOK_WORKER_ERROR_BACKOFF_MS: ${WEBHOOK_WORKER_ERROR_BACKOFF_MS:-1000}
      NOTIFICATION_PROVIDER_MODE: ${NOTIFICATION_PROVIDER_MODE:-success}
      NOTIFICATION_PROVIDER_DELAY_MS: ${NOTIFICATION_PROVIDER_DELAY_MS:-0}
      NOTIFICATION_PROVIDER_TIMEOUT_MS: ${NOTIFICATION_PROVIDER_TIMEOUT_MS:-1500}
      NOTIFICATION_WORKER_POLL_MS: ${NOTIFICATION_WORKER_POLL_MS:-1000}
      NOTIFICATION_WORKER_ID: ${NOTIFICATION_WORKER_ID:-notification-worker-1}
      NOTIFICATION_MAX_BACKOFF_MS: ${NOTIFICATION_MAX_BACKOFF_MS:-60000}
      OUTBOX_ADMIN_TOKEN: ${OUTBOX_ADMIN_TOKEN:-570243bc-c7b2-46be-84b5-38c5d5fd1751}
      NDR_RESPONSE_TIMEOUT_HOURS: ${NDR_RESPONSE_TIMEOUT_HOURS:-24}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks: [shipsense]

  # Expects the build output at dist/workers/ndr-courier-action.worker.js.
  ndr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipsense-ndr-worker
    restart: unless-stopped
    command: ["node", "dist/workers/ndr-courier-action.worker.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:root@shipsense-db:5432/ship-sense}
      DB_HOST: ${DB_HOST:-shipsense-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-ship-sense}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      SWIFTSHIP_WEBHOOK_SECRET: ${SWIFTSHIP_WEBHOOK_SECRET:-swiftship-demo-secret}
      BLUEROUTE_WEBHOOK_SECRET: ${BLUEROUTE_WEBHOOK_SECRET:-blueroute-demo-secret}
      NDR_RESPONSE_TIMEOUT_HOURS: ${NDR_RESPONSE_TIMEOUT_HOURS:-24}
    networks: [shipsense]

networks:
  shipsense:

volumes:
  shipsense_pgdata:
